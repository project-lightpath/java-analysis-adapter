name: Java CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    name: Adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run adapter tests
        run: make adapter-test

      - name: Validate captured evidence
        run: make evidence-validate

  java-lint:
    name: Java lint gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Java lint gate
        run: make java-lint

      - name: Upload Java lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-lint-reports
          path: |
            target/pmd.xml
            target/cpd.xml
            target/java-lint/
            target/java-lint-effective-pom.xml
          if-no-files-found: warn
          retention-days: 7
